<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JARVIS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <span class="mark">J.A.R.V.I.S.</span>
    <span class="clock" id="clock">--:--</span>
  </div>
  <div class="chips">
    <span class="chip" id="chipHermes"><b></b>Hermes</span>
    <span class="chip" id="chipModel"><b></b><span>Modell</span></span>
    <span class="chip" id="chipVoice"><b></b><span>Stimme</span></span>
  </div>
  <form method="post" action="/logout"><button class="ghost" type="submit">Abmelden</button></form>
</header>

<main class="stage">
  <button class="core" id="core" type="button" aria-label="JARVIS-Kern. Antippen unterbricht die Antwort.">
    <canvas id="wave" aria-hidden="true"></canvas>
    <span class="ring r1"></span>
    <span class="ring r2"></span>
    <span class="ring r3"></span>
    <span class="ring r4"></span>
    <span class="orb"><span class="orb-inner"></span></span>
  </button>
  <p class="state" id="state" aria-live="polite">Bereit</p>
  <p class="caption" id="caption"></p>
</main>

<aside class="chat" id="chat" aria-label="Chat">
  <div class="chat-head">
    <span>Verlauf</span>
    <button class="ghost small" id="clearBtn" type="button">Leeren</button>
  </div>
  <ol class="log" id="log"></ol>
  <form class="composer" id="composer">
    <input id="text" type="text" autocomplete="off" placeholder="Nachricht an JARVIS …" aria-label="Nachricht">
    <button type="submit" aria-label="Senden">➤</button>
  </form>
</aside>

<footer class="dock">
  <button class="ghost chat-toggle" id="chatToggle" type="button" aria-controls="chat" aria-expanded="false">Chat</button>
  <button class="talk" id="talk" type="button">Gespräch beginnen</button>
  <button class="ghost" id="muteBtn" type="button" aria-pressed="false">Ton an</button>
</footer>

<script src="/app.js"></script>
</body>
</html>
