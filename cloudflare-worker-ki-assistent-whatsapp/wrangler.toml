name = "neuverdrahtet-ki-assistent-whatsapp"
main = "worker.js"
compatibility_date = "2026-01-01"

# Secrets (ANTHROPIC_API_KEY, FIREBASE_SERVICE_ACCOUNT_JSON, META_ACCESS_TOKEN,
# META_PHONE_NUMBER_ID, META_VERIFY_TOKEN, META_APP_SECRET, CALENDLY_API_TOKEN)
# werden NICHT hier eingetragen, sondern per "wrangler secret put" bzw. im
# Cloudflare-Dashboard gesetzt.

# Begrenzt Claude-Aufrufe auf 20 pro Absendernummer und Minute. Seit
# P0-Sicherheitskorrektur (siehe pruefeRateLimit in worker.js) FAIL-CLOSED
# statt ungebremst durchzulassen - daher eine ZWINGENDE Voraussetzung.
# "[[unsafe.bindings]]" statt des neueren "[[ratelimits]]", weil Letzteres
# vom in der GitHub-Actions-Pipeline installierten wrangler 3.90.0 nicht
# erkannt wird (siehe ausführlicher Kommentar dazu in
# cloudflare-worker/wrangler.toml).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 20, period = 60 }
