name = "neuverdrahtet-ki-assistent-whatsapp"
main = "worker.js"
compatibility_date = "2026-01-01"

# Secrets (ANTHROPIC_API_KEY, FIREBASE_SERVICE_ACCOUNT_JSON, META_ACCESS_TOKEN,
# META_PHONE_NUMBER_ID, META_VERIFY_TOKEN, META_APP_SECRET, CALENDLY_API_TOKEN)
# werden NICHT hier eingetragen, sondern per "wrangler secret put" bzw. im
# Cloudflare-Dashboard gesetzt.

# Begrenzt Claude-Aufrufe auf 20 pro Absendernummer und Minute. Wird von
# Cloudflare beim ersten Deploy automatisch angelegt, keine manuelle
# Einrichtung im Dashboard nötig.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }
