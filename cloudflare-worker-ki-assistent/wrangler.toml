name = "neuverdrahtet-ki-assistent"
main = "worker.js"
compatibility_date = "2026-01-01"

# Secrets (ANTHROPIC_API_KEY, FIREBASE_SERVICE_ACCOUNT_JSON) werden NICHT hier
# eingetragen, sondern per "wrangler secret put" bzw. im Cloudflare-Dashboard gesetzt.

[vars]
ALLOWED_ORIGINS = "https://neuverdrahtet.com,https://www.neuverdrahtet.com"

# Begrenzt Claude-Chat-Aufrufe auf 30 pro IP und Minute - schützt vor
# unbegrenzten Kosten durch ein Skript. Wird von Cloudflare beim ersten Deploy
# automatisch angelegt, keine manuelle Einrichtung im Dashboard nötig.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
