# Automatischer Deploy der Firestore-/Storage-Security-Rules bei jedem Push
# auf main, der firestore.rules, storage.rules oder firebase.json ändert -
# ersetzt das bisherige manuelle Einfügen in der Firebase-Konsole (Firestore
# Database -> Regeln bzw. Storage -> Regeln). Betrifft ausschließlich die
# Security Rules, NICHT die Firestore-Daten selbst und auch keine Indizes
# (die sind hier nicht konfiguriert).
#
# Braucht einmalig ein FIREBASE_SERVICE_ACCOUNT-Repository-Secret: in der
# Google-Cloud-Konsole (console.cloud.google.com) beim Projekt
# "neuverdrahtet-verwaltung" unter IAM & Verwaltung -> Dienstkonten ein neues
# Dienstkonto anlegen (oder ein bestehendes nutzen), Rolle "Firebase-Regeln-
# Administrator" (roles/firebaserules.admin) zuweisen, dann unter diesem
# Dienstkonto -> Schlüssel -> Neuer Schlüssel -> JSON herunterladen und den
# kompletten Dateiinhalt als Secret FIREBASE_SERVICE_ACCOUNT im GitHub-Repo
# hinterlegen (Settings -> Secrets and variables -> Actions -> New repository
# secret). Ohne dieses Secret läuft dieser Workflow bei jedem betroffenen
# Push fehl, bis es gesetzt ist - alle anderen Workflows/Worker sind davon
# nicht betroffen.
#
# Seit P0-Phase-1/Massnahme-1 (CI-Testgate): ein vorgelagerter 'test'-Job
# fuehrt sowohl 'npm run test:unit' als auch 'npm run test:rules' (echte
# Firestore-Emulator-Tests gegen genau die Regeln, die gleich deployt werden)
# aus; der Deploy-Job haengt per 'needs: test' daran und startet nur, wenn
# beide bestehen.
name: Deploy Firebase Security Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase-rules.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g firebase-tools
      - run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          firebase deploy --only firestore:rules,storage --project neuverdrahtet-verwaltung --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
