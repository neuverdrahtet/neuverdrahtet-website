# Automatischer Deploy dieses einen Cloudflare Workers bei jedem Push auf
# main, der etwas in cloudflare-worker-kostenschaetzer/ ändert - ersetzt das bisherige manuelle
# Kopieren in die Cloudflare-Dashboard-Quick-Edit. Secrets (API-Keys,
# Zugangsdaten im Worker selbst) werden davon NICHT berührt - die bleiben
# weiterhin separat per "wrangler secret put" bzw. im Cloudflare-Dashboard
# gepflegt (siehe README.md im jeweiligen Worker-Ordner), stehen also nie im
# Git-Repo und nie in diesem Workflow.
#
# P0-Sicherheitskorrektur (Oktober 2026, Master-Audit Bericht 03): deployt erst,
# wenn der wiederverwendbare "test"-Job (.github/workflows/tests.yml, führt
# "npm run test:all" aus) ohne Fehler durchlief - vorher lief ein Push auf main
# ungetestet direkt in die Produktion.
name: Deploy neuverdrahtet-kostenschaetzer

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker-kostenschaetzer/**'
      - '.github/workflows/deploy-kostenschaetzer.yml'
  workflow_dispatch: {}

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare-worker-kostenschaetzer
          command: deploy
