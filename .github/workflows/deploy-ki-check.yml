# Automatischer Deploy dieses einen Cloudflare Workers bei jedem Push auf
# main, der etwas in cloudflare-worker-ki-check/ ändert - ersetzt das bisherige manuelle
# Kopieren in die Cloudflare-Dashboard-Quick-Edit. Secrets (API-Keys,
# Zugangsdaten im Worker selbst) werden davon NICHT berührt - die bleiben
# weiterhin separat per "wrangler secret put" bzw. im Cloudflare-Dashboard
# gepflegt (siehe README.md im jeweiligen Worker-Ordner), stehen also nie im
# Git-Repo und nie in diesem Workflow.
#
# Seit P0-Phase-1/Massnahme-1 (CI-Testgate): ein vorgelagerter 'test'-Job
# fuehrt 'npm run test:unit' aus; der Deploy-Job haengt per 'needs: test'
# daran und startet nur, wenn alle Tests bestehen.
name: Deploy neuverdrahtet-ki-check

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker-ki-check/**'
      - '.github/workflows/deploy-ki-check.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare-worker-ki-check
          command: deploy
