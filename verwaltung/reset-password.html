<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Werkora - Passwort zurücksetzen</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=20261121a">
</head>
<body>

<div class="lock-screen">
  <div class="lock-box">
    <form id="reset-form">
      <h1>Werkora</h1>
      <h2>Neues Passwort setzen</h2>
      <input type="password" id="reset-password" autocomplete="new-password" placeholder="Neues Passwort" required minlength="8">
      <input type="password" id="reset-password-confirm" autocomplete="new-password" placeholder="Neues Passwort bestätigen" required minlength="8">
      <button type="submit" id="reset-submit">Passwort setzen</button>
      <p id="reset-error" class="lock-error" hidden></p>
      <p id="reset-hint" class="lock-hint">Mindestens 8 Zeichen.</p>
      <a href="index.html" class="lock-toggle">Zurück zur Anmeldung</a>
    </form>
  </div>
</div>

<script type="module" src="js/reset-password.js"></script>
</body>
</html>
