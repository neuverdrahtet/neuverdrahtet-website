name = "neuverdrahtet-ki-angebote"
main = "worker.js"
compatibility_date = "2026-01-01"

# Secrets (ANTHROPIC_API_KEY, APP_SECRET) werden NICHT hier eingetragen,
# sondern per "wrangler secret put" bzw. im Cloudflare-Dashboard gesetzt.

[vars]
ALLOWED_ORIGINS = "https://neuverdrahtet.com,https://www.neuverdrahtet.com"
MODEL_ID = "claude-opus-4-8"

# Begrenzt die öffentliche Kunden-Upload-Route (/kunde-upload, siehe
# worker.js unterSchwellenwert/handleKundenUpload) auf 10 Anfragen pro IP
# und Minute - alle übrigen Routen prüfen weiterhin APP_SECRET und sind
# davon nicht betroffen. Wird von Cloudflare beim ersten Deploy automatisch
# angelegt, keine manuelle Einrichtung im Dashboard nötig.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# EIN täglicher Cron Trigger für zwei Aufgaben: täglicher Büro-Check +
# (nur montags) wöchentliche Katalog-Preisaktualisierung - siehe
# scheduled() in worker.js, das montags zusätzlich die Katalog-
# Aktualisierung anstößt. Bewusst EIN Trigger statt zwei: Cloudflare
# Workers Free begrenzt Cron Trigger auf 5 PRO ACCOUNT (nicht pro Worker),
# ein zweiter Trigger hier würde je nach Kontostand den Deploy mit
# "Workers Free limit of 5 cron triggers" scheitern lassen. Wird beim
# Deploy per Cloudflare-Dashboard (Quick Edit) NICHT automatisch
# übernommen - dafür im Dashboard unter Settings -> Triggers -> Cron
# Triggers manuell denselben Ausdruck eintragen (per "wrangler deploy",
# z.B. über den GitHub-Actions-Workflow, passiert das automatisch).
[triggers]
crons = ["0 5 * * *"]
