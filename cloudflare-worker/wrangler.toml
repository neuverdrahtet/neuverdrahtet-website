name = "neuverdrahtet-ki-angebote"
main = "worker.js"
compatibility_date = "2026-01-01"

# Secrets (ANTHROPIC_API_KEY, APP_SECRET) werden NICHT hier eingetragen,
# sondern per "wrangler secret put" bzw. im Cloudflare-Dashboard gesetzt.

[vars]
ALLOWED_ORIGINS = "https://neuverdrahtet.com,https://www.neuverdrahtet.com"
MODEL_ID = "claude-opus-4-8"

# Täglicher automatischer Büro-Check ("0 5 * * *") und wöchentliche
# Katalog-Preisaktualisierung ("0 6 * * 1", montags) - siehe scheduled() in
# worker.js, das anhand von event.cron zwischen beiden unterscheidet. Wird
# beim Deploy per Cloudflare-Dashboard (Quick Edit) NICHT automatisch
# übernommen - dafür im Dashboard unter Settings -> Triggers -> Cron
# Triggers manuell beide Ausdrücke eintragen.
[triggers]
crons = ["0 5 * * *", "0 6 * * 1"]
