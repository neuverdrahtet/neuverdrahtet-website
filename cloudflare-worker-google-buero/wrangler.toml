name = "neuverdrahtet-google-buero"
main = "worker.js"
compatibility_date = "2026-01-01"

# Secrets werden NICHT hier eingetragen, sondern im Cloudflare Dashboard unter
# Worker -> Settings -> Variables and Secrets (siehe README.md):
#   API_KEY
#   FIREBASE_SERVICE_ACCOUNT_JSON
#   GOOGLE_OAUTH_CLIENT_ID
#   GOOGLE_OAUTH_CLIENT_SECRET
#   OAUTH_SETUP_SECRET
# Optional als normale Variable (kein Geheimnis):
#   GOOGLE_CALENDAR_ID (Standard: "primary")

# P0-Sicherheitskorrektur (Oktober 2026, Master-Audit Bericht 03, Finding #9):
# begrenzt jeden Aufruf (inkl. der /oauth/*-Einrichtungsrouten) auf 30
# Anfragen je IP und Minute - dieser Worker hat echten Lese-/Schreibzugriff
# auf das Firmen-Gmail-/Kalender-Konto, war aber ohne jedes Rate-Limiting.
# Fehlt dieses Binding zur Laufzeit, sperrt sich der Worker jetzt bewusst
# FAIL-CLOSED (siehe pruefeRateLimit in worker.js) statt ungebremst
# durchzulassen - daher eine ZWINGENDE Voraussetzung. "[[unsafe.bindings]]"
# statt "[[ratelimits]]" aus demselben Grund wie in
# cloudflare-worker/wrangler.toml (wrangler 3.90.0 erkennt Letzteres nicht).
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1009"
simple = { limit = 30, period = 60 }

# Kein Cron-Trigger nötig - dieser Worker wird ausschließlich von der
# KI-Bürokraft (ChatGPT-Action) live aufgerufen, im Gegensatz zu
# cloudflare-worker-ki-buerokraft/ gibt es hier keine geplanten Aufgaben.

# Phase 10 - Staging-Vorlage (siehe ausführlichen Kommentar in
# cloudflare-worker/wrangler.toml): wird NUR mit "wrangler deploy --env
# staging" aktiv, sonst ohne jede Wirkung. Secrets separat per
# "wrangler secret put <NAME> --env staging" setzen - FIREBASE_SERVICE_ACCOUNT_JSON
# muss zum SEPARATEN Firebase-Staging-Projekt gehören, GOOGLE_OAUTH_CLIENT_ID/
# -SECRET zu einer eigenen Google-Cloud-Anwendung für das dedizierte
# Test-Gmail-/Kalender-Konto - niemals die Produktions-Werte wiederverwenden.
[env.staging]
name = "neuverdrahtet-google-buero-staging"

# Eigener, vom Produktions-RATE_LIMITER komplett unabhängiger Staging-Limiter.
[[env.staging.unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1012"
simple = { limit = 30, period = 60 }
