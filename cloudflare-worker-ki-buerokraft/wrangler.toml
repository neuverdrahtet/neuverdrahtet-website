name = "neuverdrahtet-ki-buerokraft"
main = "worker.js"
compatibility_date = "2026-01-01"

# Secrets werden NICHT hier eingetragen, sondern im Cloudflare Dashboard unter
# Worker -> Settings -> Variables and Secrets (siehe README.md):
#   API_KEY
#   FIREBASE_SERVICE_ACCOUNT_JSON

# Cron-Jobs (alle Zeiten in UTC - siehe README.md für die genaue Bedeutung
# und die Umrechnung in deutsche Zeit):
#   "0 6 * * *"    - täglich: invoice.overdue/task.overdue-Webhooks
#   "0 6 * * 1-5"  - Mo-Fr: Automatischer Büroablauf, Morgenroutine (~08 Uhr)
#   "0 10 * * 1-5" - Mo-Fr: Automatischer Büroablauf, Mittagscheck (~12 Uhr)
#   "0 14 * * 1-5" - Mo-Fr: Automatischer Büroablauf, Tagesabschluss (~16 Uhr)
# Falls per Dashboard statt CLI deployed wird: unter Worker -> Settings ->
# Trigger-Ereignisse -> Cron-Trigger alle vier Ausdrücke manuell eintragen.
[triggers]
crons = ["0 6 * * *", "0 6 * * 1-5", "0 10 * * 1-5", "0 14 * * 1-5"]

# Phase 10 - Staging-Vorlage (siehe ausführlichen Kommentar in
# cloudflare-worker/wrangler.toml): wird NUR mit "wrangler deploy --env
# staging" aktiv. BEWUSST OHNE [env.staging.triggers]/Cron - die
# automatisierten Büroabläufe sollen im Staging-Testbetrieb NICHT eigenständig
# anlaufen (Vorgabe "keine Aktivierung autonomer Funktionen"); ein
# Cron-Testlauf wird stattdessen manuell ausgelöst (siehe
# staging/README.md). Secrets separat per "wrangler secret put
# <NAME> --env staging" setzen, FIREBASE_SERVICE_ACCOUNT_JSON zum SEPARATEN
# Firebase-Staging-Projekt - niemals die Produktions-Werte wiederverwenden.
[env.staging]
name = "neuverdrahtet-ki-buerokraft-staging"
